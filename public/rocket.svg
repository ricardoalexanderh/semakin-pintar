<svg width="30" height="38" viewBox="0 0 30 38" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rocket body gradient -->
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FF4757;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#DCDDE1;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3DC1D3;stop-opacity:1" />
    </linearGradient>
    
    <!-- Engine glow gradient -->
    <radialGradient id="engineGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00D2FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0078FF;stop-opacity:1" />
    </radialGradient>
    
    <!-- Flame gradient -->
    <linearGradient id="flameGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF9F43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA502;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effects -->
    <filter id="engineGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feMorphology operator="dilate" radius="1"/>
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="flameGlowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feMorphology operator="dilate" radius="1"/>
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Rocket body with rounded corners (CSS: border-radius: 60% 60% 20% 60%) -->
  <path d="M 15 2 
           C 22 2 26 6 26 13
           L 26 26
           C 26 28 24 30 22 30
           L 8 30
           C 6 30 4 28 4 26
           L 4 13
           C 4 6 8 2 15 2 Z" 
        fill="url(#rocketBody)" 
        stroke="#2C3E50" 
        stroke-width="2"/>
  
  <!-- Engine/Window (blue glow circle) -->
  <circle cx="15" cy="8" r="4" 
          fill="url(#engineGlow)" 
          filter="url(#engineGlowFilter)"/>
  
  <!-- Thruster flame -->
  <polygon points="9,30 15,42 21,30" 
           fill="url(#flameGradient)" 
           filter="url(#flameGlowFilter)">
    <!-- Animated flame effect -->
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="scale"
      values="1 1;1.2 1.3;1 1"
      dur="0.3s"
      repeatCount="indefinite"/>
  </polygon>
</svg>